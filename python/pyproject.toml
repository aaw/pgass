[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "pgass"
version = "1.0.0"
description = "A pretty good answer set solver, with a pythonic API: build ASP programs as typed Python objects instead of ASP-Core-2 text."
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.9"
authors = [{ name = "Aaron Windsor" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/aaw/pgass"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "../build-python"
wheel.packages = ["pgass"]

[tool.scikit-build.cmake]
source-dir = ".."
# CMAKE_POLICY_VERSION_MINIMUM works around a CMake 4.0 break: it removed
# support for cmake_minimum_required() below 3.5, and cvc5's prebuilt release
# archive ships a Java-bindings package-config file (cvc5JavaTargets.cmake,
# never used here) that still declares one. manylinux_2_34's CMake is new
# enough to hit this; our own project's real requirement stays 3.15.
args = ["-DPGASS_BUILD_PYTHON=ON", "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
