name: CI

on:
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ hashFiles('CMakeLists.txt') }}

      - name: Build and test
        run: make

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build-asan/_deps
          key: deps-asan-${{ hashFiles('CMakeLists.txt') }}

      - name: Build and test with ASan
        run: make asan
        env:
          CC: clang
          CXX: clang++
