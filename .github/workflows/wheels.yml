name: Build and publish Python wheels and CLI binaries

# Builds on every push; publishes only when a GitHub release is published.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]

jobs:
  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            asset_os: linux
          - os: ubuntu-24.04-arm
            arch: aarch64
            asset_os: linux
          - os: macos-14
            arch: arm64
            asset_os: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: cli-deps-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/cvc5.cmake') }}

      - name: Build pgass
        run: make build

      - name: Package
        run: |
          name=pgass-${{ github.ref_name }}-${{ matrix.asset_os }}-${{ matrix.arch }}
          mkdir "$name"
          cp build/pgass LICENSE THIRD_PARTY_LICENSES.md "$name"/
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.asset_os }}-${{ matrix.arch }}
          path: pgass-*.tar.gz

  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build-python/_deps
          key: wheels-deps-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/cvc5.cmake') }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: "cp3{9,10,11,12,13}-*"
          # cvc5's prebuilt archive is glibc-only, so no musllinux (Alpine).
          CIBW_SKIP: "*-musllinux*"
          # Default manylinux2014's glibc is too old to link the prebuilt cvc5 archive.
          CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_2_34_x86_64
          CIBW_MANYLINUX_AARCH64_IMAGE: quay.io/pypa/manylinux_2_34_aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Uploads to PyPI via trusted publishing; needs a pending publisher registered there.
  publish:
    if: github.event_name == 'release'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "wheels-*"
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Attaches the CLI binaries built by build-cli to the GitHub release itself.
  publish-cli:
    if: github.event_name == 'release'
    needs: [build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "cli-*"
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
